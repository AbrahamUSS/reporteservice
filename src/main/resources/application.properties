spring.application.name=reporteservice

# Render inyecta la variable PORT; en local usa 8080
server.port=${PORT:8080}

# Conexion a la base de datos por variables de entorno (nunca credenciales en el repo)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reportesdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate crea/actualiza la tabla reportes automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Fechas en formato ISO (yyyy-MM-dd'T'HH:mm:ss) en el JSON
spring.jackson.serialization.write-dates-as-timestamps=false
